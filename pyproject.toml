[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-costs"
version = "0.1.0"
description = "Transparent spread, commission, and square-root impact estimates."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
execution-cost-demo = "execution_costs.experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
